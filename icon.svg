<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular halo / aura -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.3"/>
  <circle cx="256" cy="240" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.2"/>

  <!-- Open Shastra / Book Base -->
  <g transform="translate(256, 360)">
    <!-- Book pages left & right -->
    <path d="M 0,20 C -40,10 -100,5 -140,25 C -150,28 -150,-35 -140,-40 C -100,-55 -40,-45 0,-35 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 0,20 C 40,10 100,5 140,25 C 150,28 150,-35 140,-40 C 100,-55 40,-45 0,-35 Z" fill="#f8fafc" opacity="0.95"/>
    <!-- Book spine & depth -->
    <path d="M -140,25 L -140,32 C -100,12 -40,17 0,27 C 40,17 100,12 140,32 L 140,25 Z" fill="#6366f1"/>
    <!-- Page text lines simulation -->
    <line x1="-110" y1="-22" x2="-25" y2="-18" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="-110" y1="-6" x2="-35" y2="-2" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="-100" y1="10" x2="-20" y2="14" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="-18" x2="110" y2="-22" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="-2" x2="110" y2="-6" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="14" x2="100" y2="10" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Dhanvantari Amrita Kalasha (Nectar Pot) -->
  <g id="kalasha" transform="translate(256, 225)">
    <!-- Glow aura -->
    <ellipse cx="0" cy="15" rx="70" ry="60" fill="url(#goldGrad)" opacity="0.15" filter="url(#glow)"/>

    <!-- Kalasha Base & Body -->
    <path d="M -24,70 Q 0,74 24,70 L 28,64 Q 0,60 -28,64 Z" fill="url(#goldGrad)"/>
    <!-- Pot Belly -->
    <path d="M -24,64 C -72,50 -72,-10 -28,-25 L 28,-25 C 72,-10 72,50 24,64 Z" fill="url(#goldGrad)"/>
    <!-- Ornamental bands on pot -->
    <path d="M -50,22 Q 0,40 50,22" fill="none" stroke="#78350f" stroke-width="3" opacity="0.4"/>
    <path d="M -42,38 Q 0,54 42,38" fill="none" stroke="#78350f" stroke-width="2" opacity="0.3"/>
    
    <!-- Pot Neck & Rim -->
    <path d="M -30,-25 L -20,-42 L 20,-42 L 30,-25 Z" fill="#eab308"/>
    <ellipse cx="0" cy="-42" rx="28" ry="8" fill="#fef08a"/>
    <ellipse cx="0" cy="-42" rx="20" ry="5" fill="#ca8a04"/>

    <!-- Ayurvedic Medicinal Leaves (Guduchi / Tulsi / Neem) arising from Kalasha -->
    <!-- Center tall leaf -->
    <path d="M 0,-44 C -22,-85 -10,-125 0,-145 C 10,-125 22,-85 0,-44 Z" fill="url(#emeraldGrad)"/>
    <path d="M 0,-44 L 0,-140" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Left leaf -->
    <path d="M -12,-43 C -45,-65 -65,-95 -55,-120 C -35,-115 -20,-85 -12,-43 Z" fill="url(#emeraldGrad)"/>
    <path d="M -12,-43 C -25,-75 -40,-95 -50,-115" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Right leaf -->
    <path d="M 12,-43 C 45,-65 65,-95 55,-120 C 35,-115 20,-85 12,-43 Z" fill="url(#emeraldGrad)"/>
    <path d="M 12,-43 C 25,-75 40,-95 50,-115" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Golden Amrita Droplet / Tejas at top -->
    <circle cx="0" cy="-155" r="9" fill="url(#goldGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="-155" r="5" fill="#ffffff"/>
  </g>

  <!-- Academic Star of Excellence / AIAPGET Crest -->
  <g transform="translate(256, 460)">
    <rect x="-85" y="-18" width="170" height="28" rx="14" fill="#1e293b" stroke="url(#indigoGrad)" stroke-width="1.5"/>
    <text x="0" y="2" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="2.5" text-anchor="middle">AIAPGET</text>
  </g>
</svg>
